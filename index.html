<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的精美產品介紹</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fcfbfa; /* 溫馨的米白色背景 */
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .header {
            padding: 40px 20px 20px;
        }
        .header h1 {
            font-size: 28px;
            color: #333333;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .header p {
            font-size: 14px;
            color: #888888;
        }
        .product-card {
            background: #ffffff;
            width: 90%;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        /* 圖片樣式 */
        .product-img {
            width: 100%;
            border-radius: 8px;
            background-color: #eaeaea; /* 圖片載入前的底色 */
            height: 300px;
            object-fit: cover;
        }
        .price {
            font-size: 22px;
            color: #d97777;
            font-weight: bold;
            margin: 15px 0 5px;
        }
        .desc {
            font-size: 15px;
            line-height: 1.6;
            color: #666666;
            padding: 0 10px 20px;
        }
        /* 購買/詢問按鈕 */
        .btn {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 20px auto;
            padding: 14px;
            background: #d97777; /* 溫柔的玫瑰色按鈕 */
            color: #ffffff;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(217, 119, 119, 0.3);
        }
        .btn:hover {
            background: #c26363;
        }
        .footer {
            font-size: 12px;
            color: #aaa;
            padding: 30px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>美物專區</h1>
        <p>用心為您推薦</p>
    </div>

    <div class="product-card">
        <img class="product-img" src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=600&q=80" alt="商品圖片">
        
        <div class="price">NT$ 1,380</div>
        
        <div class="desc">
            <p><strong>精選優質配方 3 | 幼兒成長羊奶配方</strong></p>
            <p>・ 全脂牛乳天然豐富營養，富含天然GOS益生元。<br>
            ・ 優質配方含DHA、ALA等引導必備的維生素和礦物質。<br>
            ・ 紐西蘭原裝進口，國際認證，品質保證。</p>
        </div>
    <a class="btn" href="https://lin.ee/QSVMhLhc" target="_blank">立即私訊購買 / 詢問</a>
    </div>

    <div class="footer">
        © 2026 我的品牌介紹頁面 All Rights Reserved.
    </div>

</body>
</html>
