    <title>小室美物</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f3f0;
            color: #4a4a4a;
        }

        /* 1. 頂部滿版色塊與 Logo */
        .top-bar {
            background-color: #E5CEC8;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .logo {
            font-size: 40px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 50px;
            width: auto;
            display: block;
        }

        /* 2. 右上角購物車圖示 */
        .cart-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            text-decoration: none;
            color: #4A3B32;
            display: flex;
            align-items: center;
        }
        .cart-icon svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        /* 3. 多頁滑動 Banner 與小圓點指示器 */
        .banner-wrapper {
            position: relative;
            margin-bottom: 0px;
        }
        .banner-container {
            width: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .banner-container::-webkit-scrollbar {
            display: none;
        }
        .banner-slide {
            flex: 0 0 100%;
            width: 100%;
            scroll-snap-align: start;
        }
        .banner-slide img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        /* Banner 小圓點指示器 */
        .banner-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            transition: background-color 0.3s, transform 0.3s;
        }
        .dot.active {
            background-color: #ffffff;
            transform: scale(1.2);
        }

        /* 4. 品牌理念區塊 (左右並排) */
        .brand-story-section {
            display: flex;
            width: 100%;
            margin-bottom: 40px;
        }
        .brand-text-box {
            flex: 1;
            background-color: #E5CEC8;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .brand-subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: #4A3B32;
            font-weight: 500;
        }
        /* 統一顏文字的白色與大小間距 */
        .brand-symbol {
            color: #ffffff;
            font-size: 16px;
            margin: 5px 0;
        }
        .brand-title {
            font-size: 22px;
            font-style: italic;
            margin-bottom: 5px;
            font-weight: bold;
            color: #FFDB64;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .brand-quote {
            font-size: 20px;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .brand-desc {
            font-size: 14px;
            letter-spacing: 1.5px;
            line-height: 1.5;
            color: #4A3B32;
            font-weight: 500;
        }
        .brand-img-box {
            flex: 1;
            height: auto;
        }
        .brand-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 容器限制寬度 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px 40px;
        }

        .section-title {
            text-align: center;
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 30px;
            color: #4A3B32;
            letter-spacing: 1px;
        }

        .section-title.second {
            text-align: center;
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* 5. 兩欄商品排版 */
        .product-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .product-card {
            flex: 1;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .product-img-box {
            width: 100%;
            height: 300px;
            border-radius: 4px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            margin-bottom: 8px;
            transition: transform 0.2s;
        }
        .product-card:hover .product-img-box {
            transform: translateY(-3px);
        }
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            text-align: left;
            padding: 0 4px;
            margin-bottom: 20px;
        }
        .product-name {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }
        .product-price {
            font-size: 14px;
            color: #d97777;
            font-weight: bold;
        }

        /* 第二組精選商品的專屬滿版色塊容器 */
        .second-section-wrapper {
            background-color: #E5CEC8;
            width: 100%;
            padding-top: 20px;
            padding-bottom: 20px;
            margin-bottom: 0px;
        }

        /* 6. 底部社群橫幅區塊 */
        .social-banner-section {
            position: relative;
            width: 100%;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 0px;
            overflow: hidden;
        }
        .social-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .social-banner-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .social-title {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-decoration: none;
            font-size: 18px;
            transition: 0.2s;
            color: #4A3B32;
        }
        .social-btn:hover {
            transform: scale(1.1);
        }

        /* 響應式手機版微調 */

            .banner-slide img {
                height: 220px;
            }
            .brand-story-section {
                flex-direction: column;
            }
            .product-img-box {
                height: 160px;
            }
        }

    <!-- 自動連動 Banner 小圓點的極輕量 JavaScript -->
    <script>
        const container = document.getElementById('bannerContainer');
        const slides = container.querySelectorAll('.banner-slide');
        const dotsContainer = document.getElementById('bannerDots');

        slides.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        });

        const dots = dotsContainer.querySelectorAll('.dot');

        container.addEventListener('scroll', () => {
            const index = Math.round(container.scrollLeft / container.clientWidth);
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        });
