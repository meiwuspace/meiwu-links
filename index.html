<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的品牌首頁</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fcfbfa;
            color: #4a4a4a;
        }

        /* 1. 頂部滿版色塊與 Logo */
        .top-bar {
            background-color: #ffffff;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #333333;
            letter-spacing: 1px;
            text-decoration: none;
        }

        /* 2. 右上角購物車圖示 */
        .cart-icon {
 <svg xmlns="http://www.w3.org/2000/svg" 
     shape-rendering="geometricPrecision" 
     text-rendering="geometricPrecision" 
     image-rendering="optimizeQuality" 
     fill-rule="evenodd" 
     clip-rule="evenodd" 
     viewBox="0 0 512 512">
     
    <path fill-rule="nonzero" d="M170.663 256.157... (後面那一大串路徑)" />
</svg>

        }

        /* 3. 多頁滑動 Banner 與小圓點指示器 */
        .banner-wrapper {
            position: relative;
            margin-bottom: 30px;
        }
        .banner-container {
            width: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .banner-container::-webkit-scrollbar {
            display: none;
        }
        .banner-slide {
            flex: 0 0 100%;
            width: 100%;
            scroll-snap-align: start;
        }
        .banner-slide img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        /* Banner 小圓點指示器 */
        .banner-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            transition: background-color 0.3s, transform 0.3s;
        }
        .dot.active {
            background-color: #ffffff;
            transform: scale(1.2);
        }

        /* 容器限制寬度 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px 40px;
        }

        .section-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            color: #555555;
            letter-spacing: 1px;
        }

        /* 5. 兩欄商品排版（圖片與文字獨立拆開） */
        .product-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }
        .product-card {
            flex: 1;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        /* 圖片獨立框 */
        .product-img-box {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            margin-bottom: 8px; /* 圖片與下方文字的適當間距 */
            transition: transform 0.2s;
        }
        .product-card:hover .product-img-box {
            transform: translateY(-3px);
        }
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 文字說明獨立出來，不與圖片框黏在一起 */
        .product-info {
            text-align: left; /* 靠左對齊更有質感，也可改成 center */
            padding: 0 4px;
        }
        .product-name {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }
        .product-price {
            font-size: 14px;
            color: #d97777;
            font-weight: bold;
        }

        /* 6. LINE 和 IG 連結圖示並排 */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-decoration: none;
            font-size: 18px;
            transition: 0.2s;
        }
        .social-btn:hover {
            transform: scale(1.1);
        }

        /* 響應式手機版微調 */
        @media (max-width: 480px) {
            .banner-slide img {
                height: 220px;
            }
            .product-img-box {
                height: 140px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. 頂部滿版色塊與 Logo -->
    <header class="top-bar">
        <a href="index.html" class="logo">✨ 你的品牌名稱</a>
        <a href="#" class="cart-icon" title="購物車">🛒</a>
    </header>

    <!-- 3. 多頁滑動 Banner 與小圓點指示器 -->
    <div class="banner-wrapper">
        <div class="banner-container" id="bannerContainer">
            <div class="banner-slide">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" alt="Banner 1">
            </div>
            <div class="banner-slide">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80" alt="Banner 2">
            </div>
            <div class="banner-slide">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1200&q=80" alt="Banner 3">
            </div>
        </div>
        <!-- 小圓點容器（數量會自動對應圖片張數） -->
        <div class="banner-dots" id="bannerDots"></div>
    </div>

    <div class="container">
        
        <div class="section-title">—— 精選商品 ——</div>

        <!-- 5. 兩欄商品圖片與文字分離 -->
        <div class="product-grid">
            <!-- 商品 1 -->
            <a href="detail.html" class="product-card">
                <div class="product-img-box">
                    <img class="product-img" src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=500&q=80" alt="商品 1">
                </div>
                <div class="product-info">
                    <div class="product-name">商品名稱 A </div>
                    <div class="product-price">NT$ 1,380</div>
                </div>
            </a>

            <!-- 商品 2 -->
            <a href="detail.html" class="product-card">
                <div class="product-img-box">
                    <img class="product-img" src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=500&q=80" alt="商品 2">
                </div>
                <div class="product-info">
                    <div class="product-name">商品名稱 B</div>
                    <div class="product-price">NT$ 990</div>
                </div>
            </a>
        </div>

        <div class="section-title">—— 追蹤我們 ——</div>

        <!-- 6. LINE 和 IG 連結圖示並排 -->
        讓大家能夠透過社群媒體找到你
        <div class="social-links">
            <a href="https://line.me/R/" target="_blank" class="social-btn" title="LINE 官方帳號">💚</a>
            <a href="https://instagram.com/" target="_blank" class="social-btn" title="Instagram">📸</a>
        </div>

    </div>

    <!-- 自動連動 Banner 小圓點的極輕量 JavaScript -->
    <script>
        const container = document.getElementById('bannerContainer');
        const slides = container.querySelectorAll('.banner-slide');
        const dotsContainer = document.getElementById('bannerDots');

        // 自動生成對應數量的小圓點
        slides.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        });

        const dots = dotsContainer.querySelectorAll('.dot');

        // 監聽滑動事件，即時切換變深的圓點
        container.addEventListener('scroll', () => {
            const index = Math.round(container.scrollLeft / container.clientWidth);
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        });
    </script>

</body>
</html>
